name: Claude worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send to Claude
        required: false
        default: Hi da machi!! Wake up!!
  schedule:
    - cron: '0 * * * *'

jobs:
  claude-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Run Claude
        env:
          # Raw, because pasting into the GitHub secrets box can introduce a
          # line wrap that gets saved as part of the value. Tokens never
          # legitimately contain whitespace, so strip it before use.
          CLAUDE_CODE_OAUTH_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_PROMPT: ${{ inputs.prompt }}
        run: |
          token=$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN_RAW" | tr -d '[:space:]')
          echo "::add-mask::$token"
          export CLAUDE_CODE_OAUTH_TOKEN="$token"
          echo "Token length after stripping whitespace: ${#token}"
          bash ./scripts/run-claude.sh
