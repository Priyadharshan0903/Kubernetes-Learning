name: Claude worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt to send to Claude
        required: false
        default: Hi da machi!! Wake up!!
  schedule:
    # Off-peak minute: minute 0 is the most congested slot on GitHub's
    # scheduler, where runs are delayed and sometimes dropped outright.
    - cron: '23 * * * *'

# A run that is waiting on a usage-limit reset can outlive the hour, so serialise
# runs instead of letting one blocked run accumulate an hourly backlog behind it.
concurrency:
  group: claude-worker
  cancel-in-progress: false

jobs:
  claude-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_PROMPT: ${{ inputs.prompt }}
        run: |
          bash ./scripts/run-claude.sh
